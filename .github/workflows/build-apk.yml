name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download large database asset
        run: |
          mkdir -p app/src/main/assets/database
          curl -L -o app/src/main/assets/database/database_players.json \
            https://github.com/mountsagiata/Fm-Sim/releases/download/assets-v1/database_players.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for stable download link
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/*.apk release-out/FmSimulation.apk

      - name: Publish to 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: release-out/FmSimulation.apk
          body: "Auto-built from the latest push to main."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FmSimulation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
