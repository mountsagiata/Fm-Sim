name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download large database asset
        run: |
          mkdir -p app/src/main/assets/database
          curl -L -o app/src/main/assets/database/database_players.json \
            https://github.com/mountsagiata/Fm-Sim/releases/download/assets-v1/database_players.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-out
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "SHORT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          
          cp app/build/outputs/apk/debug/*.apk "release-out/FmSimulation-V1.0.${{ github.run_number }}.apk"
          
          ls -la release-out/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FM Simulation V1.0.${{ github.run_number }}"
          files: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk
          body: |
            **Info:**
            - Trigger: ${{ github.event_name }}
            - Commit Hash: ${{ env.SHORT_HASH }}
            
            **Version:**
            Build #${{ github.run_number }}
            
            **Date & Time:**
            ${{ github.event.head_commit.timestamp }}
            
            **Changelog:**
            ${{ github.event.head_commit.message }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FmSimulation-V1.0.${{ github.run_number }}
          path: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk