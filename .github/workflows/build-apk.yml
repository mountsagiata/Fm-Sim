name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}  # Tetap bisa dijalankan manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download large database asset
        run: |
          mkdir -p app/src/main/assets/database
          curl -L -o app/src/main/assets/database/database_players.json \
            https://github.com/mountsagiata/Fm-Sim/releases/download/assets-v1/database_players.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-out
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "SHORT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          cp app/build/outputs/apk/debug/*.apk "release-out/FmSimulation-V1.0.${{ github.run_number }}.apk"
          
          ls -la release-out/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FM Simulation V1.0.${{ github.run_number }}"
          files: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk
          body: |
            ## 🚀 FM Simulation V1.0.${{ github.run_number }}
            
            **📋 Info Build:**
            - Trigger: ${{ github.event_name }}
            - Commit: `${{ env.SHORT_HASH }}`
            - Build Number: #${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}
            
            ---
            
            **📝 Changelog:**
            
            ${{ env.COMMIT_MSG }}
            
            ---
            
            **📦 Download:**
            - [FmSimulation-V1.0.${{ github.run_number }}.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/FmSimulation-V1.0.${{ github.run_number }}.apk)

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FmSimulation-V1.0.${{ github.run_number }}
          path: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk