name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download large database asset
        run: |
          mkdir -p app/src/main/assets/database
          curl -L -o app/src/main/assets/database/database_players.json \
            https://github.com/mountsagiata/Fm-Sim/releases/download/assets-v1/database_players.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with commit hash
        run: |
          mkdir -p release-out
          COMMIT_HASH=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/*.apk release-out/FmSimulation-${COMMIT_HASH}.apk
          cp app/build/outputs/apk/debug/*.apk release-out/FmSimulation-latest.apk

      - name: Create Release with timestamp
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }} - ${{ github.sha }}
          files: release-out/FmSimulation-*.apk
          body: |
            Auto-built from commit ${{ github.sha }}
            Date: ${{ github.event.head_commit.timestamp }}
            Trigger: ${{ github.event_name }}

      - name: Update latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: release-out/FmSimulation-latest.apk
          body: "Latest auto-build from main branch"
          prerelease: false

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FmSimulation-debug-apk-${{ github.run_number }}
          path: release-out/FmSimulation-*.apk
