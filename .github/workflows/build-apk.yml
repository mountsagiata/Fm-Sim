name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}  # Tetap bisa dijalankan manual

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download large database asset
        run: |
          mkdir -p app/src/main/assets/database
          curl -L -o app/src/main/assets/database/database_players.json \
            https://github.com/mountsagiata/Fm-Sim/releases/download/assets-v1/database_players.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Prepare APK file
        run: |
          mkdir -p release-out
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "SHORT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          cp app/build/outputs/apk/debug/*.apk "release-out/FmSimulation-V1.0.${{ github.run_number }}.apk"
          
          ls -la release-out/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v5
        with:
          name: FmSimulation-V1.0.${{ github.run_number }}
          path: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v5
        with:
          name: FmSimulation-V1.0.${{ github.run_number }}
          path: release-out
      - name: Publish verified APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FM Simulation V1.0.${{ github.run_number }}"
          files: release-out/FmSimulation-V1.0.${{ github.run_number }}.apk
          body: |
            Verified by unit tests, Android lint, and assembleDebug.
            Commit: `${{ github.sha }}`
